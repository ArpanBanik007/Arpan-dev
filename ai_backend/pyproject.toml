[project]
name = "ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpan Banik", email = "arpanbanik976@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-backend = "ai_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
